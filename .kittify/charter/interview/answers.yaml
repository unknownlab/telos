schema_version: 1.0.0
mission: software-dev
profile: comprehensive
answers:
  project_intent: >-
    Telos is a new "everything as code" full-stack framework for next-generation
    software. It is developed as a Bun workspaces monorepo: deployable apps in
    apps/, reusable framework packages in packages/. Product and architecture
    changes go through Spec Kitty missions; GRACE holds architecture knowledge.
  languages_frameworks: >-
    TypeScript (strict) on Bun only (minimum version pinned in package.json
    engines.bun; currently a canary build because Bun's built-in lint and fmt
    are canary-only). Bun is the runtime, package manager, test runner, type
    checker (bun check), linter (bun lint) and formatter (bun fmt). No extra
    task runner, linter or formatter without an owner decision.
  testing_requirements: >-
    Test-first: every behavior change starts with a failing test (bun test)
    that encodes the acceptance criterion, then the implementation. Tests must
    fail exactly when the contract is violated; no fake, placeholder or
    always-passing tests. Prefer black-box tests at package boundaries.
  quality_gates: >-
    Blocking gates before review, accept and merge: format check, lint,
    typecheck, tests, the documentation build with its Verification check, the
    browser tests and grace lint (bun run verify). The pre-commit hook runs the
    fast checks on staged work (no documentation build, no browser tests). Gates are never bypassed (--no-verify,
    --force, --skip-*, *_DISABLE) without an explicit owner decision.
  review_policy: >-
    Model routing for missions: work packages are sized so that small models
    (Claude Haiku class, mid to max reasoning effort) can implement each one
    from its prompt alone; every work package is reviewed by Claude Sonnet;
    the post-merge mission review runs on Claude Opus at high effort.
    Reviewers check spec fidelity (FR/NFR/C coverage), test-first evidence,
    gate results reported exactly, and GRACE sync. Reject on any unverified
    claim.
  performance_targets: >-
    Local developer loop stays fast: pre-commit hook under 5 seconds on small
    change sets; full verify under 60 seconds until the repo grows enough to
    renegotiate it. Product performance targets are set per mission.
  deployment_constraints: >-
    No deployment target or CI yet (owner decision: local checks only). Merges
    to main only through pull requests after owner approval. Releases and
    deploys are owner decisions.
  documentation_policy: >-
    docs/tooling.md is the owner-facing tooling overview and must match shipped
    behavior in the same mission that changes it. Product terms are defined in
    docs/foundation/terminology/; process terms live in the Spec Kitty glossary.
    Both are used consistently in specs, code and docs.
    Architecture knowledge lives in .grace/, kept in sync inside each mission.
  risk_boundaries: >-
    The most costly failure is wrong behavior: silent logic bugs and drift
    between spec and code. Mitigations: test-first, spec-fidelity review,
    GRACE contracts and verification, smallest viable diffs. Dependencies are
    added only with owner approval and supply-chain checks (pinned versions,
    no unreviewed install scripts). No credentials in the repo.
  amendment_process: >-
    The owner amends the charter by stating new guidance in chat; the agent
    updates answers.yaml, regenerates, and commits with a chore(charter)
    message. AGENTS.md, CLAUDE.md and .kittify/config.yaml change only with
    owner approval.
  exception_policy: >-
    Any deviation from the charter or AGENTS.md (skipped gate, missing CI,
    unapproved dependency) must be an explicit owner decision recorded in the
    mission (Decision Moment or plan Charter Check) with its rationale and the
    follow-up that removes it.

terms:
  - surface: telos
    definition: The "everything as code" full-stack framework for next-generation software developed in this repository. Write it as "Telos" in prose.
    confidence: 1.0
    status: active
  - surface: workspace
    definition: The Bun workspaces monorepo rooted at the repository root, declared by the root package.json "workspaces" field. Not a Spec Kitty worktree and not an editor workspace.
    confidence: 1.0
    status: active
  - surface: workspace area
    definition: One of the two top-level directories that hold workspace packages, apps/ and packages/. A directory directly under an area is a workspace package.
    confidence: 1.0
    status: active
  - surface: workspace package
    definition: A directory directly under apps/ or packages/ with its own package.json. Use instead of "module", "project" or "sub-repo".
    confidence: 1.0
    status: active
  - surface: app
    definition: A deployable workspace package under apps/.
    confidence: 1.0
    status: active
  - surface: library package
    definition: A reusable workspace package under packages/, consumed by apps or other library packages.
    confidence: 1.0
    status: active
  - surface: check suite
    definition: The full read-only set of repository checks, run by "bun run verify" - version guard, format check, lint, typecheck, test and grace lint. Use instead of "CI checks" (there is no CI).
    confidence: 1.0
    status: active
  - surface: verify
    definition: The root script ("bun run verify") that runs the check suite in order and stops at the first failure.
    confidence: 1.0
    status: active
  - surface: minimum bun version
    definition: The lowest Bun version the repository supports, declared once in package.json engines.bun as ">=<version>". Currently a canary build because bun lint and bun fmt are canary-only.
    confidence: 1.0
    status: active
  - surface: version guard
    definition: scripts/check-bun-version.ts, which refuses to run on a Bun older than the minimum bun version. Runs on preinstall, in the pre-commit hook and first in verify.
    confidence: 1.0
    status: active
  - surface: pre-commit hook
    definition: .githooks/pre-commit - formats and restages staged files, then blocks the commit on lint, typecheck, test or grace lint failure. Distinct from the commit-msg hook, which checks Conventional Commits.
    confidence: 1.0
    status: active
  - surface: review gate
    definition: Spec Kitty's pre-review check driven by review.test_command in .kittify/config.yaml; runs the check suite and blocks review on regression.
    confidence: 1.0
    status: active
  - surface: grace
    definition: GRACE 4, the architecture knowledge layer in .grace/ (contracts, module graph, verification, semantic markup), validated by "grace lint". Owns architecture knowledge; Spec Kitty owns the change lifecycle.
    confidence: 1.0
    status: active
  - surface: owner
    definition: The human who directs the work and makes product, architecture, dependency, merge and destructive decisions. Agents never decide these.
    confidence: 1.0
    status: active
